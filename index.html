<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BN Smart Mental Health Screening | รพ.สต.บึงเนียม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#00B894; --emerald-strong:#00876C; --emerald-ink:#00705A; --mint:#E3F6EF; --mint-2:#F0FAF6;
  --blue:#0984E3; --blue-ink:#0767B1; --blue-soft:#E6F2FC;
  --bg:#F5FBF8; --card:#FFFFFF; --ink:#0B1F3A; --muted:#55657A; --line:#DCEAE3;
  --orange:#FF9F43; --orange-ink:#8F4700; --orange-soft:#FFF2E5;
  --yellow:#F2C230; --red:#C0392B; --red-ink:#A12A1F; --red-soft:#FDECEA;
  --grey:#94A3B8;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(11,31,58,.04),0 6px 20px rgba(11,31,58,.06);
  --shadow-lg:0 10px 40px rgba(11,31,58,.16);
  --sidebar:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Kanit','Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.3}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .2s ease}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px}
.brand-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--emerald),#00A3A0);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(0,184,148,.35)}
.brand-logo svg{width:24px;height:24px;stroke:#fff}
.brand b{display:block;font-weight:600;font-size:15px;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.nav{padding:8px 10px;flex:1;overflow:auto}
.nav-label{font-size:11.5px;color:var(--muted);padding:12px 12px 6px;letter-spacing:.4px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:transparent;border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;font-size:14.5px;margin-bottom:2px}
.nav button:hover{background:var(--mint-2)}
.nav button.active{background:var(--mint);color:var(--emerald-ink);font-weight:500;box-shadow:inset 3px 0 0 var(--emerald)}
.nav button .lock{margin-left:auto;color:var(--grey)}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,251,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
.topbar h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;border:0;background:#fff;border-radius:10px;padding:8px;cursor:pointer;box-shadow:var(--shadow)}
.content{padding:24px;max-width:1280px;width:100%;margin:0 auto}
.backdrop-nav{display:none}

/* ---------- Components ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(220,234,227,.7);padding:20px}
.card + .card{margin-top:16px}
.grid > .card{margin-top:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{font-size:17px}
.card-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.mt{margin-top:16px}.mt-s{margin-top:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:500;font-size:14.5px;background:#fff;color:var(--ink);border-color:var(--line);transition:background .15s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--mint-2)}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt input:focus-visible+span{outline:3px solid rgba(9,132,227,.35);outline-offset:2px}
.btn.primary{background:var(--emerald-strong);color:#fff;border-color:var(--emerald-strong)}
.btn.primary:hover{background:#007760}
.btn.blue{background:var(--blue-ink);color:#fff;border-color:var(--blue-ink)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:#EEF2F6;color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--mint);color:var(--emerald-ink)}
.pill.warn{background:var(--orange-soft);color:var(--orange-ink)}
.pill.bad{background:var(--red-soft);color:var(--red-ink)}
.pill.info{background:var(--blue-soft);color:var(--blue-ink)}
.lv-0{background:var(--mint);color:var(--emerald-ink)}
.lv-1{background:#FFF7DB;color:#7A5B00}
.lv-2{background:var(--orange-soft);color:var(--orange-ink)}
.lv-3{background:var(--red-soft);color:var(--red-ink)}
.lv--1{background:#EEF2F6;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:500}
.field .hint{font-size:12.5px;color:var(--muted)}
.req::after{content:" *";color:var(--red)}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid #CFE0D8;background:#fff;border-radius:11px;padding:9px 12px;font-size:15px;min-height:42px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--emerald);outline:none;box-shadow:0 0 0 3px rgba(0,184,148,.18)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--emerald-strong)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--mint-2);font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFDFC}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;border:1px solid transparent}
.alert.info{background:var(--blue-soft);color:#0A4A80;border-color:#CBE3F7}
.alert.warn{background:var(--orange-soft);color:#6E3A00;border-color:#FFD9B3}
.alert.bad{background:var(--red-soft);color:#7D1F16;border-color:#F5C6C0}
.alert.ok{background:var(--mint);color:#004D3D;border-color:#BDE8DA}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi .k-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.kpi .k-val{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k-label{font-weight:500;margin-top:4px}
.kpi .k-sub{font-size:12.5px;color:var(--muted)}
.ic-em{background:var(--mint);color:var(--emerald-ink)}
.ic-bl{background:var(--blue-soft);color:var(--blue-ink)}
.ic-or{background:var(--orange-soft);color:var(--orange-ink)}
.ic-rd{background:var(--red-soft);color:var(--red-ink)}
.ic-gr{background:#EEF2F6;color:var(--muted)}
.skeleton .k-val{color:#B8C7C0}

/* hero */
.hero{background:linear-gradient(120deg,#00B894 0%,#00A3A0 55%,#0984E3 120%);color:#fff;border-radius:20px;padding:26px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 12px 30px rgba(0,150,122,.25)}
.hero h2{font-size:22px;font-weight:600}
.hero p{margin:6px 0 0;opacity:.95;max-width:640px}
.hero .btn{background:#fff;color:var(--emerald-ink);border-color:#fff}

/* bars */
.bar-row{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:6px 0;font-size:13.5px}
.bar-track{background:#EEF4F1;border-radius:999px;height:12px;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.bar-fill{height:100%;border-radius:999px}
.dual .bar-track{height:18px;background:transparent;border-radius:6px}
.dual .bar-fill{height:8px;border-radius:4px;min-width:2px}
.stack-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#EEF4F1}
.stack-bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.c-l0{background:#00B894}.c-l1{background:#F2C230}.c-l2{background:#FF9F43}.c-l3{background:#C0392B}.c-l-1{background:#A9B6C6}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}
.chart-scroll{overflow-x:auto}
@media (max-width: 640px){ .chart-scroll svg{min-width:600px} }

/* empty state */
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .e-ic{width:64px;height:64px;border-radius:20px;background:var(--mint);display:grid;place-items:center;margin:0 auto 14px;color:var(--emerald-ink)}
.empty .e-ic svg{width:30px;height:30px}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:4px}

/* screening */
.a-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.a-card{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.a-card:hover:not([disabled]){border-color:var(--emerald);box-shadow:var(--shadow)}
.a-card[disabled]{cursor:not-allowed;background:#FAFBFC}
.a-card b{font-size:18px}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.q.missing{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,159,67,.18)}
.q.hidden{display:none}
.q-n{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--mint);color:var(--emerald-ink);font-weight:600;font-size:13px;margin-right:8px;padding:0 6px}
.q-t{font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;min-height:42px;padding:8px 16px;border:1.5px solid #CFE0D8;border-radius:12px;cursor:pointer;background:#fff;font-size:14.5px}
.opt input:checked+span{background:var(--emerald-strong);border-color:var(--emerald-strong);color:#fff}
.progress{height:8px;background:#E7F1EC;border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:var(--emerald);transition:width .2s}
.crisis{border:2px solid var(--red);background:#FFF8F7;border-radius:16px;padding:18px;position:sticky;top:70px;z-index:5;box-shadow:0 8px 24px rgba(192,57,43,.15)}
.crisis h3{color:var(--red-ink);display:flex;gap:8px;align-items:center;font-size:17px}
.crisis ol{margin:10px 0 12px 20px;padding:0}
.crisis li{margin:4px 0}
.result{border-radius:18px;padding:22px;border:1px solid var(--line);background:#fff}
.score-big{font-size:44px;font-weight:600;line-height:1}

/* modal + toast */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,31,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;padding:22px}
.modal.lg{max-width:860px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-head h3{flex:1;font-size:18px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast-root{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:14px;display:flex;gap:10px;align-items:center;max-width:420px;animation:tin .2s ease}
.toast.ok{background:#005E4B}.toast.bad{background:var(--red-ink)}.toast.warn{background:#7A3E00}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500}
.tabs button.active{color:var(--emerald-ink);border-bottom-color:var(--emerald)}
.user-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--emerald-ink);display:grid;place-items:center;font-weight:600}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#F1F5F4;padding:2px 6px;border-radius:6px;word-break:break-all}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;font-size:13.5px;color:var(--muted)}
.steps{margin:8px 0 0 18px;padding:0}
.steps li{margin:6px 0}

@media (max-width: 1100px){ .g-3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 900px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop-nav{display:block;position:fixed;inset:0;background:rgba(11,31,58,.35);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 16px}
  .content{padding:16px}
  .g-2,.g-3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 90px}
  .user-chip .who{display:none}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
}
@media (max-width: 520px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px}.kpi .k-val{font-size:24px}
  .hero{padding:20px}
  .topbar .conn-text{display:none}
}
@media print{.sidebar,.topbar,.btn{display:none!important}.main{margin:0}}
</style>
</head>
<body>
<noscript><p style="padding:20px">กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานระบบ</p></noscript>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/><polyline points="7 12 10 12 11.5 9 13 15 14.5 12 17 12"/></svg></div>
      <div><b>BN Smart Mental</b><small>ระบบคัดกรองสุขภาพจิต<br>รพ.สต.บึงเนียม</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div>BN Smart Mental Health Screening</div>
      <div id="foot-mode">—</div>
    </div>
  </aside>
  <div class="backdrop-nav" data-act="toggleNav"></div>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" data-act="toggleNav" aria-label="เปิดเมนู"><svg class="i" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 id="page-title">Dashboard</h1>
      <span class="pill" id="conn-pill" role="status"><span class="dot"></span><span class="conn-text">กำลังตรวจสอบการเชื่อมต่อ…</span></span>
      <div id="user-area"></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
/* =============================================================================
 * การตั้งค่าการเชื่อมต่อ — แก้ไขเพียงจุดเดียว
 * - ใช้งานผ่าน Apps Script (HTML Service): ไม่ต้องแก้ ระบบจะใช้ google.script.run อัตโนมัติ
 * - เปิดไฟล์ HTML แยกจาก GAS: ใส่ Web App URL ที่ลงท้ายด้วย /exec
 * ห้ามใส่รหัสผ่าน ข้อมูลผู้รับบริการ หรือ Secret ใด ๆ ในไฟล์นี้
 * ========================================================================== */
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwAD_ylxNfnoSwgMt4OiB3u6Pj_LhFxHA7CgeuWCxP8s6K6AZjBEe7Wbf8kust9GXKuEg/exec";

const REQUEST_TIMEOUT_MS = 30000;
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const URL_OK = /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec(\?.*)?$/.test(GAS_WEB_APP_URL);
const MODE = IN_GAS ? 'gas' : (URL_OK ? 'fetch' : 'none');
const IS_FILE = location.protocol === 'file:';

/* ---------- Utilities ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ try{ if (crypto.randomUUID) return crypto.randomUUID(); const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,12); } }
function todayISO(){ return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' }); }
function addMonthsISO(iso, n){ const [y,m] = iso.split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.toISOString().slice(0,10); }
function addDaysISO(iso, n){ const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); }

function fmtDate(iso){ if(!iso) return '-'; const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return esc(iso); return Number(m[3]) + ' ' + TH_MON[Number(m[2])-1] + ' ' + (Number(m[1]) + 543); }
function fmtDateTime(s){ if(!s) return '-'; const t = String(s).slice(11,16); return fmtDate(s) + (t ? ' ' + t + ' น.' : ''); }
function fmtMonth(ym){ const [y,m] = ym.split('-').map(Number); return TH_MON[m-1] + ' ' + String(y + 543).slice(2); }

function storeToken(t){ try{ t ? sessionStorage.setItem('bn_token', t) : sessionStorage.removeItem('bn_token'); }catch(e){} }

/* ---------- API client ---------- */
function mkErr(code, message, data){ const e = new Error(message); e.code = code; e.data = data; return e; }

function api(action, payload, opts){
  opts = opts || {};
  const req = { action: action, payload: payload || {}, token: State.token || null };
  State.lastApiAt = Date.now();
  return new Promise((resolve, reject) => {
    let settled = false;
    const done = (fn, v) => { if (settled) return; settled = true; clearTimeout(timer); fn(v); };
    const timer = setTimeout(() => done(reject, mkErr('TIMEOUT', 'การเชื่อมต่อใช้เวลานานเกินไป ระบบยังไม่ยืนยันผล กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')), opts.timeout || REQUEST_TIMEOUT_MS);
    if (MODE === 'gas') {
      google.script.run
        .withSuccessHandler(res => done(resolve, res))
        .withFailureHandler(() => done(reject, mkErr('NETWORK', 'ไม่สามารถเชื่อมต่อ Backend ได้ กรุณาลองใหม่')))
        .apiRouter(req);
    } else if (MODE === 'fetch') {
      fetch(GAS_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow', cache: 'no-store', credentials: 'omit' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(res => done(resolve, res))
        .catch(() => done(reject, mkErr('NETWORK', 'ไม่สามารถเชื่อมต่อ Backend ได้ ตรวจสอบ URL, การ Deploy (Who has access) และอินเทอร์เน็ต')));
    } else {
      done(reject, mkErr('NOT_CONFIGURED', 'ยังไม่ได้ตั้งค่าการเชื่อมต่อ Backend'));
    }
  }).then(res => {
    setConn('ok');
    if (!res || typeof res !== 'object') throw mkErr('BAD_RESPONSE', 'ได้รับข้อมูลตอบกลับไม่ถูกต้องจาก Backend');
    if (res.success) return res;
    const e = mkErr(res.code || 'ERROR', res.message || 'เกิดข้อผิดพลาด', res.data);
    if ((res.code === 'SESSION_INVALID' || res.code === 'SESSION_EXPIRED') && State.token) sessionLost(res.message);
    else if (res.code === 'PASSWORD_CHANGE_REQUIRED' && State.session) {
      State.session.must_change_password = true;
      if (!$('form[data-form="changePassword"]')) { render(); openChangePassword(true); }
    }
    throw e;
  }, err => {
    if (err.code === 'NETWORK' || err.code === 'TIMEOUT') setConn('bad');
    throw err;
  });
}

function setConn(s){
  const el = $('#conn-pill');
  const map = { ok:['ok','เชื่อมต่อแล้ว'], bad:['bad','เชื่อมต่อไม่ได้'], none:['warn','ยังไม่ได้ตั้งค่าการเชื่อมต่อ'], wait:['', 'กำลังตรวจสอบการเชื่อมต่อ…'] };
  const m = map[s] || map.wait;
  el.className = 'pill ' + m[0];
  el.querySelector('.conn-text').textContent = m[1];
  el.title = m[1];
}

/* ---------- UI helpers ---------- */
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = icon(type === 'bad' ? 'alert' : type === 'warn' ? 'alert' : 'check', 'sm') + '<span>' + esc(msg) + '</span>';
  $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), type === 'bad' ? 7000 : 4000);
}
function setBusy(btn, busy, label){
  if (!btn) return;
  if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + esc(label || 'กำลังดำเนินการ…'); }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}
function openModal(html, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.dataset.dismissable = opts.dismissable === false ? '0' : '1';
  wrap.innerHTML = '<div class="modal ' + (opts.size || '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  if (opts.dismissable !== false) wrap.addEventListener('mousedown', e => { if (e.target === wrap) wrap.remove(); });
  $('#modal-root').appendChild(wrap);
  const f = wrap.querySelector('[autofocus],input:not([type=hidden]),select,textarea');
  if (f) setTimeout(() => f.focus(), 40);
  return wrap;
}
function modalHead(title, closable){ return '<div class="modal-head"><h3>' + esc(title) + '</h3>' + (closable === false ? '' : '<button class="btn ghost sm" data-act="closeModal" aria-label="ปิด">' + icon('x','sm') + '</button>') + '</div>'; }
function closeAllModals(){ $('#modal-root').innerHTML = ''; }

}

function go(view, params){
  const nav = NAV.find(n => n.view === view);
  if (view !== 'dashboard' && !loggedIn()) { openLogin('กรุณาเข้าสู่ระบบเพื่อใช้งานเมนูนี้'); return; }
  if (nav && nav.perm && !can(nav.perm)) { toast('ท่านไม่มีสิทธิ์ใช้งานเมนูนี้', 'warn'); return; }
  State.view = view;
  State.params = params || {};
  if (view !== 'screening') State.form = null;
  document.body.classList.remove('nav-open');
  render();
  window.scrollTo(0, 0);
}
function render(){
  State.renderSeq++;
  renderNav();
  renderUserArea();
  $('#page-title').textContent = TITLES[State.view] || 'BN Smart Mental Health';
  if (loggedIn() && State.session.must_change_password) {
    $('#view').innerHTML = '<div class="card">' + emptyState('ต้องเปลี่ยนรหัสผ่านก่อนเข้าถึงข้อมูล', 'ระบบจะไม่แสดงข้อมูลจนกว่าจะเปลี่ยนรหัสผ่านเริ่มต้น/ชั่วคราว', 'lock') + '<div class="row" style="justify-content:center"><button class="btn primary" data-act="forceChangePassword">เปลี่ยนรหัสผ่าน</button></div></div>';
    return;
  }
  const fn = Views[State.view] || Views.dashboard;
  fn(State.renderSeq);
}
const stale = seq => seq !== State.renderSeq;

/* ---------- Session ---------- */
function applySession(data){
  if (data.token) { State.token = data.token; storeToken(data.token); }
  State.session = data;
  State.lastActivity = Date.now();
}
function clearSession(){
  State.token = null; State.session = null; State.villages = []; State.catalog = null; State.form = null;
  storeToken(null);
  closeAllModals();
  $('#view').innerHTML = '';
}
function sessionLost(message){
  clearSession();
  State.view = 'dashboard'; State.params = {};
  render();
  openLogin(message || 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
}
async function afterLogin(){
  if (State.session.must_change_password) { render(); openChangePassword(true); return; }
  try { State.villages = (await api('listVillages')).data || []; } catch (e) { State.villages = []; }
  render();
}
async function logout(reason){
  const t = State.token;
  clearSession();
  State.view = 'dashboard'; State.params = {};
  render();
  if (t) { try { State.token = t; await api('logout'); } catch (e) {} finally { State.token = null; } }
  toast(reason || 'ออกจากระบบแล้ว', reason ? 'warn' : 'ok');
}
// Idle timeout ฝั่ง Browser + keep-alive เมื่อผู้ใช้ยังทำงานอยู่ (Server ตรวจซ้ำเสมอ)
['mousedown','keydown','touchstart','scroll'].forEach(ev => document.addEventListener(ev, () => { State.lastActivity = Date.now(); }, { passive: true }));
setInterval(() => {
  if (!loggedIn()) return;
  const idleMs = (State.session.idle_timeout_seconds || 1800) * 1000;
  const now = Date.now();
  if (now - State.lastActivity > idleMs) { logout('ออกจากระบบอัตโนมัติเนื่องจากไม่มีการใช้งาน'); return; }
  if (now - State.lastActivity < 5 * 60000 && now - State.lastApiAt > 10 * 60000) {
    api('getSession').then(r => { State.session = Object.assign(State.session, r.data); }).catch(() => {});
  }
}, 30000);

Views.dashboard = function(seq){
  if (MODE === 'none') { $('#view').innerHTML = setupGuideHtml(); return; }
  if (!loggedIn()) { $('#view').innerHTML = dashboardPreviewHtml(); return; }
  const f = State.params.filters || defaultFilters();
  State.params.filters = f;
  $('#view').innerHTML = dashboardFilterHtml(f) + '<div id="dash-body" class="mt">' + loadingBox() + '</div>';
  api('getDashboard', f).then(res => {
    if (stale(seq)) return;
    $('#dash-body').innerHTML = dashboardBodyHtml(res.data);
  }).catch(err => { if (!stale(seq) && $('#dash-body')) $('#dash-body').innerHTML = errorBox(err); });
};

function niceMax(v){ if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function monthlyChart(months){
  const W = 760, H = 270, pl = 40, pr = 12, pt = 14, pb = 34;
  const n = months.length || 1;
  const max = niceMax(Math.max(1, ...months.map(m => Math.max(m.screenings, m.unique_patients, m.followup))));
  const ih = H - pt - pb, cw = (W - pl - pr) / n, bw = Math.max(3, Math.min(16, cw * 0.3));
  const y = v => pt + ih * (1 - v / max);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟแนวโน้มรายเดือน">';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '" stroke="#E3EEE9"/><text x="' + (pl - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + Math.round(v) + '</text>'; }
  const step = Math.ceil(n / 12);
  const pts = [];
  months.forEach((m, i) => {
    const cx = pl + i * cw + cw / 2;
    s += '<rect x="' + (cx - bw - 1) + '" y="' + y(m.screenings) + '" width="' + bw + '" height="' + (pt + ih - y(m.screenings)) + '" rx="3" fill="#00B894"><title>' + fmtMonth(m.month) + ': คัดกรอง ' + m.screenings + ' ครั้ง</title></rect>';
    s += '<rect x="' + (cx + 1) + '" y="' + y(m.unique_patients) + '" width="' + bw + '" height="' + (pt + ih - y(m.unique_patients)) + '" rx="3" fill="#0984E3"><title>' + fmtMonth(m.month) + ': ' + m.unique_patients + ' คน</title></rect>';
    pts.push([cx, y(m.followup), m]);
    if (i % step === 0) s += '<text x="' + cx + '" y="' + (H - 12) + '" text-anchor="middle">' + fmtMonth(m.month) + '</text>';
  });
  s += '<polyline fill="none" stroke="#FF9F43" stroke-width="2.5" points="' + pts.map(p => p[0] + ',' + p[1]).join(' ') + '"/>';
  pts.forEach(p => { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="#fff" stroke="#E07B12" stroke-width="2"><title>' + fmtMonth(p[2].month) + ': ต้องติดตาม ' + p[2].followup + '</title></circle>'; });
  return s + '</svg>';
}
function villageBars(rows){
  if (!rows.length) return emptyState('ไม่มีข้อมูลรายหมู่บ้าน');
  const max = Math.max(1, ...rows.map(r => r.screenings));
  return '<div class="dual">' + rows.map(r =>
    '<div class="bar-row"><div title="' + esc(r.label) + '" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.label) + '</div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + (r.screenings / max * 100) + '%;background:#00B894"></div><div class="bar-fill" style="width:' + (r.unique_patients / max * 100) + '%;background:#0984E3"></div></div>' +
    '<div class="small" style="text-align:right">' + num(r.screenings) + ' ครั้ง · ' + num(r.unique_patients) + ' คน' + (r.followup ? '<br><span style="color:var(--orange-ink)">ติดตาม ' + num(r.followup) + '</span>' : '') + '</div></div>').join('') + '</div>';
}
function typeBars(types){
  if (!types.length) return emptyState('ไม่มีข้อมูล');
  return '<div class="stack">' + types.map(t =>
    '<div><div class="row" style="justify-content:space-between"><b style="font-weight:500">' + esc(TYPE_LABEL[t.type] || t.type) + '</b><span class="small muted">' + num(t.total) + ' ครั้ง</span></div>' +
    '<div class="stack-bar mt-s">' + t.results.map(r => '<span class="c-l' + r.level + '" style="width:' + (r.count / t.total * 100) + '%" title="' + esc(r.label) + ': ' + r.count + '"></span>').join('') + '</div>' +
    '<div class="legend mt-s">' + t.results.map(r => '<span><i class="c-l' + r.level + '"></i>' + esc(r.label) + ' <b style="color:var(--ink);font-weight:500">' + num(r.count) + '</b> (' + Math.round(r.count / t.total * 100) + '%)</span>').join('') + '</div></div>').join('') + '</div>';
}

function historyTable(items, showPatient){
  if (!items.length) return emptyState('ยังไม่มีประวัติการคัดกรอง', null, 'clock');
  return '<div class="table-wrap"><table><thead><tr><th>วันที่</th>' + (showPatient ? '<th>ผู้รับบริการ</th><th>หมู่บ้าน</th>' : '') + '<th>แบบประเมิน</th><th>สถานะ</th><th class="num">คะแนน</th><th>ผลแปลผล</th><th>ผู้ประเมิน</th><th>ทบทวนผล</th><th></th></tr></thead><tbody>' +
    items.map(s => {
      const voided = s.completion_status === 'VOIDED';
      const result = s.restricted ? '<span class="pill">' + icon('lock','sm') + ' จำกัดสิทธิ์</span>' :
        (s.completion_status === 'INCOMPLETE' ? levelPill(-1, 'ประเมินไม่ครบ') + (s.incomplete_reason ? '<div class="small muted">' + esc(s.incomplete_reason) + '</div>' : '') : levelPill(s.level, s.result_label)) +
        (s.danger_flag ? ' <span class="pill bad">' + icon('alert','sm') + ' สัญญาณอันตราย</span>' : '');
      const acts = [];
      if (can('canViewAnswers')) acts.push('<button class="btn sm" data-act="screeningDetail" data-id="' + esc(s.screening_id) + '">รายละเอียด</button>');
      if (showPatient) acts.push('<button class="btn sm" data-act="openPatient" data-id="' + esc(s.patient_id) + '">ผู้รับบริการ</button>');
      const am = (s.amendments || []).map(a => '<div class="small muted">• ' + esc(a.action === 'VOID' ? 'ยกเลิก' : a.action === 'REVIEW' ? 'ทบทวน' : a.action) + ' โดย ' + esc(a.actor_name) + ' ' + fmtDateTime(a.timestamp) + (a.reason ? ' — ' + esc(a.reason) : '') + '</div>').join('');
      return '<tr' + (voided ? ' style="opacity:.6"' : '') + '><td>' + fmtDate(s.screening_date) + '</td>' +
        (showPatient ? '<td>' + esc(s.patient_name) + '</td><td>' + esc(s.village_label) + '</td>' : '') +
        '<td><b style="font-weight:500">' + esc(TYPE_LABEL[s.assessment_type] || s.assessment_type) + '</b><div class="small muted">v ' + esc(s.assessment_version) + '</div></td>' +
        '<td>' + (voided ? '<span class="pill bad">ยกเลิกแล้ว</span>' : esc(STATUS_LABEL[s.completion_status] || s.completion_status)) + '</td>' +
        '<td class="num">' + (s.restricted || s.total_score === null || s.total_score === undefined ? '-' : esc(s.total_score)) + '</td>' +
        '<td>' + result + am + '</td><td>' + esc(s.assessor_name) + '</td>' +
        '<td>' + (s.reviewed_by_name ? '<span class="pill ok">' + icon('check','sm') + ' ' + esc(s.reviewed_by_name) + '</span>' : (voided ? '-' : '<span class="pill warn">รอทบทวน</span>')) + '</td>' +
        '<td><div class="row" style="flex-wrap:nowrap">' + acts.join('') + '</div></td></tr>';
    }).join('') + '</tbody></table></div>';
}

Views.screening = async function(seq){

    '<div class="field full" id="inc-wrap" style="display:none"><label class="req" for="sf-r">เหตุผลที่ประเมินไม่ครบ</label><input id="sf-r" type="text" name="incomplete_reason" maxlength="300" placeholder="เช่น ผู้รับบริการขอหยุดพัก / ไม่สามารถสื่อสารได้"></div></div>' +

function qLabel(def, q, i){
  if (q.show_if) { const parent = def.questions.findIndex(x => x.code === q.show_if.question_code); return parent >= 0 ? (visibleIndex(def, parent) + '.1') : '•'; }
  return String(visibleIndex(def, i));
}
function visibleIndex(def, i){ let n = 0; for (let k = 0; k <= i; k++) if (!def.questions[k].show_if) n++; return n; }
function isVisible(q, answers){ if (!q.show_if) return true; const a = answers[q.show_if.question_code]; const allowed = (q.show_if.answer_codes || [q.show_if.answer_code]).map(String); return a !== undefined && allowed.indexOf(String(a)) >= 0; }
function updateScreeningUI(){
  const f = State.form; if (!f) return;
  let visible = 0, answered = 0, danger = false;
  f.def.questions.forEach(q => {
    const el = $('[data-q="' + CSS.escape(q.code) + '"].q');
    const vis = isVisible(q, f.answers);
    if (!vis && f.answers[q.code] !== undefined) { delete f.answers[q.code]; $$('input', el).forEach(i => { i.checked = false; }); }
    el.classList.toggle('hidden', !vis);
    if (vis) { visible++; if (f.answers[q.code] !== undefined) { answered++; el.classList.remove('missing'); } }
    if (vis && q.danger && (q.danger.answer_codes || []).map(String).indexOf(String(f.answers[q.code])) >= 0) danger = true;
  });
  $('#q-progress-text').textContent = 'ตอบแล้ว ' + answered + '/' + visible + ' ข้อ';
  $('#q-progress').style.width = (visible ? answered / visible * 100 : 0) + '%';
  showCrisis(danger);
}
function showCrisis(on){
  const slot = $('#crisis-slot'); if (!slot) return;
  const had = !!slot.firstChild;
  slot.innerHTML = on ? crisisHtml() : '';
  if (on && !had) { slot.scrollIntoView({ behavior: 'smooth', block: 'start' }); toast('พบคำตอบที่เป็นสัญญาณอันตราย — ดำเนินการช่วยเหลือเร่งด่วนได้ทันที', 'bad'); }
}

/* ---------- System ---------- */
Views.system = function(seq){
  const tab = State.params.tab || 'overview';
  const tabs = [['overview','ภาพรวม']].concat(can('canManageSystem') ? [['assess','แบบประเมิน'],['villages','หมู่บ้าน'],['config','การตั้งค่า'],['audit','Audit Log']] : []);
  $('#view').innerHTML = '<div class="tabs" role="tablist">' + tabs.map(t => '<button role="tab" data-act="sysTab" data-tab="' + t[0] + '" class="' + (tab === t[0] ? 'active' : '') + '">' + t[1] + '</button>').join('') + '</div><div id="sys-body">' + loadingBox() + '</div>';
  const body = html => { if (!stale(seq)) $('#sys-body').innerHTML = html; };
  const fail = err => body(errorBox(err));
  if (tab === 'overview') {
    api('getSystemStatus').then(r => body(systemOverviewHtml(r.data))).catch(fail);
  } else if (tab === 'assess') {
    api('getAssessmentConfigs').then(r => body(assessConfigHtml(r.data))).catch(fail);
  } else if (tab === 'villages') {
    api('listVillages', { include_inactive: true }).then(r => { State.allVillages = r.data; body(villagesHtml(r.data)); }).catch(fail);
  } else if (tab === 'config') {
    api('getSystemStatus').then(r => body(appConfigHtml(r.data.app_config || []))).catch(fail);
  } else if (tab === 'audit') {
    api('getAuditLogs', { action: State.params.auditAction || '', limit: 200 }).then(r => body(auditHtml(r.data.items))).catch(fail);
  }
};

const Actions = {
  toggleNav(){ document.body.classList.toggle('nav-open'); },
  nav(el){ go(el.dataset.view); },
  openLogin(){ openLogin(); },
  logout(){ logout(); },
  closeModal(el){ const m = el.closest('.modal-backdrop'); if (m) m.remove(); },
  openChangePassword(){ openChangePassword(!!(State.session && State.session.must_change_password)); },
  forceChangePassword(){ openChangePassword(true); },
  quickRange(el){
    const t = todayISO(); const f = State.params.filters || defaultFilters();
    const r = el.dataset.r;
    if (r === 'month') f.date_from = t.slice(0, 8) + '01';
    if (r === '3m') f.date_from = addMonthsISO(t, -2);
    if (r === '12m') f.date_from = addMonthsISO(t, -11);
    if (r === 'fy') { const [y, m] = t.split('-').map(Number); f.date_from = (m >= 10 ? y : y - 1) + '-10-01'; }
    f.date_to = t; State.params.filters = f; render();
  },
  openUnreviewed(){ go('history', { only_followup: true, only_unreviewed: true, date_from: (State.params.filters || {}).date_from, date_to: (State.params.filters || {}).date_to }); },
  newPatient(){ go('patientForm', {}); },
  openPatient(el){ if (el.dataset.id) go('patient', { patient_id: el.dataset.id }); else go('patients'); },
  editPatient(el){ go('patientForm', { patient_id: el.dataset.id }); },
  patientsPage(el){ State.params.page = Number(el.dataset.page); render(); },
  historyPage(el){ State.params.page = Number(el.dataset.page); render(); },
  startScreening(el){ go('screening', { patient_id: el.dataset.id }); },
  pickPatient(el){ go('screening', { patient_id: el.dataset.id }); },
  pickAssessment(el){
    const pid = (State.form && State.form.patient && State.form.patient.patient_id) || State.params.patient_id;
    go('screening', { patient_id: pid, type: el.dataset.type });
  },
  async screeningDetail(el){
    const m = openModal(modalHead('รายละเอียดการคัดกรอง') + '<div id="sd-body">' + loadingBox() + '</div>', { size: 'lg' });
    try {
      const d = (await api('getScreeningDetail', { screening_id: el.dataset.id })).data;
      const voided = d.completion_status === 'VOIDED';
      $('#sd-body', m).innerHTML = '<dl class="kv"><dt>ผู้รับบริการ</dt><dd>' + esc(d.patient_name) + ' · ' + esc(d.village_label) + '</dd><dt>แบบประเมิน</dt><dd>' + esc(d.title) + ' (v ' + esc(d.assessment_version) + ')</dd>' +
        '<dt>วันที่คัดกรอง</dt><dd>' + fmtDate(d.screening_date) + ' · บันทึก ' + fmtDateTime(d.created_at) + ' โดย ' + esc(d.assessor_name) + '</dd>' +
        '<dt>ผล</dt><dd>' + (d.completion_status === 'INCOMPLETE' ? levelPill(-1, 'ประเมินไม่ครบ') : levelPill(d.level, d.result_label) + (d.total_score !== null && d.total_score !== undefined ? ' คะแนน ' + esc(d.total_score) : '')) + (voided ? ' <span class="pill bad">ยกเลิกแล้ว</span>' : '') + '</dd>' +
        '<dt>ทบทวนผล</dt><dd>' + (d.reviewed_by_name ? esc(d.reviewed_by_name) : 'ยังไม่ทบทวน') + '</dd></dl>' +
        '<div class="table-wrap mt"><table><thead><tr><th>ข้อ</th><th>คำถาม</th><th>คำตอบ</th><th class="num">คะแนน</th></tr></thead><tbody>' +
        d.answers.map(a => '<tr><td><span class="code">' + esc(a.question_code) + '</span></td><td>' + esc(a.question_text) + '</td><td>' + esc(a.answer_label) + '</td><td class="num">' + esc(a.score) + '</td></tr>').join('') + '</tbody></table></div>' +
        (!voided ? '<div class="modal-foot">' + (!d.reviewed_by_name && can('canReview') ? '<button class="btn primary" data-act="reviewScreening" data-id="' + esc(d.screening_id) + '">' + icon('check','sm') + ' บันทึกว่าทบทวนผลแล้ว</button>' : '') +
          (can('canVoid') ? '<button class="btn danger" data-act="voidScreening" data-id="' + esc(d.screening_id) + '">ยกเลิกรายการ (บันทึกผิด)</button>' : '') + '</div>' : '');
    } catch (err) { const b = $('#sd-body', m); if (b) b.innerHTML = errorBox(err); }
  },
  reviewScreening(el){
    const m = openModal(modalHead('ทบทวนผลการคัดกรอง') + '<form data-form="review" class="stack"><input type="hidden" name="screening_id" value="' + esc(el.dataset.id) + '"><div class="field"><label>บันทึกการทบทวน (ถ้ามี)</label><textarea name="note" maxlength="300" placeholder="เช่น ได้ส่งต่อพยาบาลจิตเวชแล้ว"></textarea><span class="hint">ไม่ควรบันทึกรายละเอียดทางคลินิกเกินความจำเป็น</span></div><div class="modal-foot"><button type="button" class="btn" data-act="closeModal">ยกเลิก</button><button class="btn primary" type="submit">บันทึก</button></div></form>');
    return m;
  },
  voidScreening(el){
    openModal(modalHead('ยกเลิกรายการคัดกรอง') + '<div class="alert warn">' + icon('alert') + '<div>ใช้เมื่อบันทึกผิดคน/ผิดแบบประเมินเท่านั้น ข้อมูลเดิมจะยังคงอยู่ในประวัติพร้อมเหตุผลการยกเลิก และไม่ถูกนับใน Dashboard</div></div>' +
      '<form data-form="void" class="stack mt"><input type="hidden" name="screening_id" value="' + esc(el.dataset.id) + '"><div class="field"><label class="req">เหตุผล</label><textarea name="reason" maxlength="300" minlength="5" required></textarea></div><div class="modal-foot"><button type="button" class="btn" data-act="closeModal">ปิด</button><button class="btn danger" type="submit">ยืนยันยกเลิกรายการ</button></div></form>');
  },
  userModal(el){ const u = el.dataset.id ? (State.usersCache || []).find(x => x.user_id === el.dataset.id) : null; userModal(u); },
  async resetPassword(el){
    if (!await confirmDialog('รีเซ็ตรหัสผ่าน', '<p>สร้างรหัสผ่านชั่วคราวใหม่ให้บัญชี <b>' + esc(el.dataset.name) + '</b>? Session ที่ใช้งานอยู่ของผู้ใช้นี้จะสิ้นสุดทันที</p>', 'รีเซ็ต', true)) return;
    try { const r = await api('resetUserPassword', { user_id: el.dataset.id }); showTempPassword(el.dataset.name, r.data.temp_password); render(); }
    catch (err) { toast(err.message, 'bad'); }
  },
  copyTemp(){ const t = $('#tmp-pw').textContent; if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('คัดลอกแล้ว', 'ok'), () => toast('คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตนเอง', 'warn')); },
  sysTab(el){ State.params.tab = el.dataset.tab; render(); },
  renameVillage(el){
    const v = (State.allVillages || []).find(x => x.village_id === el.dataset.id); if (!v) return;
    openModal(modalHead('แก้ชื่อหมู่บ้าน') + '<form data-form="renameVillage" class="stack"><input type="hidden" name="village_id" value="' + esc(v.village_id) + '"><div class="field"><label class="req">ชื่อหมู่บ้าน (หมู่ ' + esc(v.moo_number) + ')</label><input name="village_name" type="text" maxlength="80" required value="' + esc(v.village_name) + '"></div><div class="modal-foot"><button type="button" class="btn" data-act="closeModal">ยกเลิก</button><button class="btn primary" type="submit">บันทึก</button></div></form>');
  },
  async toggleVillage(el){
    try { await api('updateVillage', { village_id: el.dataset.id, active_status: el.dataset.on === '1' }); toast('บันทึกแล้ว', 'ok'); State.villages = (await api('listVillages')).data; render(); }
    catch (err) { toast(err.message, 'bad'); }
  }
};

async function submitWith(btn, fn){
  if (btn && btn.disabled) return;
  setBusy(btn, true, 'กำลังบันทึก…');
  try { await fn(); } finally { if (btn && document.body.contains(btn)) setBusy(btn, false); }
}

const Forms = {
  async login(form){
    const btn = form.querySelector('[type=submit]'); const msg = $('#lg-msg');
    msg.innerHTML = '';
    await submitWith(btn, async () => {
      try {
        const d = formData(form);
        const r = await api('login', { username: d.username, password: d.password }, { timeout: 45000 });
        form.reset();
        applySession(r.data);
        closeAllModals();
        toast('เข้าสู่ระบบสำเร็จ', 'ok');
        await afterLogin();
      } catch (err) { form.password.value = ''; msg.innerHTML = errorBox(err); }
    });
  },
  async changePassword(form){
    const d = formData(form); const msg = $('#cp-msg'); msg.innerHTML = '';
    if (d.new_password !== d.confirm) { msg.innerHTML = errorBox({ message: 'รหัสผ่านใหม่และการยืนยันไม่ตรงกัน' }); return; }
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try {
        const r = await api('changePassword', { current_password: d.current_password, new_password: d.new_password }, { timeout: 45000 });
        applySession(r.data);
        closeAllModals();
        toast(r.message || 'เปลี่ยนรหัสผ่านเรียบร้อย', 'ok');
        await afterLogin();
      } catch (err) { if (document.body.contains(msg)) msg.innerHTML = errorBox(err); }
    });
  },
  dashFilter(form){ const d = formData(form); if (d.date_from > d.date_to) { toast('วันที่เริ่มต้นต้องไม่หลังวันที่สิ้นสุด', 'warn'); return; } State.params.filters = d; render(); },
  patientSearch(form){ const d = formData(form); State.params.q = d.q; State.params.village_id = d.village_id; State.params.page = 1; render(); },
  historyFilter(form){ const d = formData(form); Object.assign(State.params, { date_from: d.date_from, date_to: d.date_to, village_id: d.village_id, assessment_type: d.assessment_type, only_followup: !!d.only_followup, only_unreviewed: !!d.only_unreviewed, page: 1 }); render(); },
  async patient(form, confirmDup){
    const d = formData(form); const msg = $('#pf-msg'); msg.innerHTML = '';
    const id = State.params.patient_id;
    const payload = Object.assign(d, { client_request_id: State.params.reqId, confirm_not_duplicate: !!confirmDup });
    if (id) payload.patient_id = id;
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try {
        const r = await api(id ? 'updatePatient' : 'createPatient', payload);
        toast(r.message, 'ok');
        go('patient', { patient_id: r.data.patient_id });
      } catch (err) {
        if (err.code === 'DUPLICATE_SUSPECTED') { showDuplicateDialog(err, form); return; }
        msg.innerHTML = errorBox(err);
        if (err.code === 'TIMEOUT') msg.innerHTML += '<div class="alert info mt-s">' + icon('refresh') + '<div class="small">กดบันทึกอีกครั้งได้อย่างปลอดภัย ระบบใช้รหัสคำขอเดิมเพื่อป้องกันการบันทึกซ้ำ</div></div>';
      }
    });
  },
  async pickSearch(form){
    const q = formData(form).q; const box = $('#pick-list');
    if (!q) { box.innerHTML = '<p class="small muted">กรุณาพิมพ์รหัสหรือชื่อเพื่อค้นหา</p>'; return; }
    box.innerHTML = loadingBox('กำลังค้นหา…');
    try {
      const d = (await api('listPatients', { q: q, page_size: 20 })).data;
      box.innerHTML = d.items.length ? '<div class="table-wrap"><table><tbody>' + d.items.map(r => '<tr class="click" data-act="pickPatient" data-id="' + esc(r.patient_id) + '"><td><b style="font-weight:500">' + esc(r.full_name) + '</b><div class="small muted">' + esc(r.patient_id) + ' · ' + (r.age !== null ? r.age + ' ปี · ' : '') + esc(r.village_label) + '</div></td><td>' + consentPill(r.consent_status) + '</td><td style="text-align:right"><span class="btn sm">เลือก</span></td></tr>').join('') + '</tbody></table></div>' : emptyState('ไม่พบผู้รับบริการ', 'ตรวจสอบการสะกด หรือลงทะเบียนใหม่', 'search');
    } catch (err) { box.innerHTML = errorBox(err); }
  },
  async screening(form){
    const f = State.form; if (!f || f.submitting) return;
    const d = formData(form); const msg = $('#sf-msg'); msg.innerHTML = '';
    const completion = d.completion_status;
    if (completion === 'COMPLETE') {
      const missing = f.def.questions.filter(q => isVisible(q, f.answers) && f.answers[q.code] === undefined);
      missing.forEach(q => $('[data-q="' + CSS.escape(q.code) + '"].q').classList.add('missing'));
      if (missing.length) { msg.innerHTML = errorBox({ message: 'ยังตอบไม่ครบ ' + missing.length + ' ข้อ — หากผู้รับบริการไม่สามารถตอบต่อได้ ให้เลือก “ประเมินไม่ครบ” พร้อมเหตุผล' }); $('.q.missing').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    } else if (!d.incomplete_reason) { msg.innerHTML = errorBox({ message: 'กรุณาระบุเหตุผลที่ประเมินไม่ครบ' }); return; }
    f.submitting = true;
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try {
        const r = await api('createScreening', {
          patient_id: f.patient.patient_id, assessment_type: f.def.type, assessment_version: f.def.version,
          answers: f.answers, completion_status: completion, incomplete_reason: d.incomplete_reason || '',
          screening_date: d.screening_date, client_request_id: f.reqId
        });
        f.result = r.data;
        toast(r.message, 'ok');
        renderScreeningResult(r.data);
      } catch (err) {
        if (!document.body.contains(msg)) return;
        msg.innerHTML = errorBox(err);
        if (err.code === 'TIMEOUT' || err.code === 'NETWORK') msg.innerHTML += '<div class="alert info mt-s">' + icon('refresh') + '<div class="small">ระบบยังไม่ยืนยันการบันทึก กดบันทึกอีกครั้งได้อย่างปลอดภัย (ใช้รหัสคำขอเดิม ไม่เกิดรายการซ้ำ)</div></div>';
        if (err.code === 'VERSION_CHANGED') msg.innerHTML += '<button type="button" class="btn sm mt-s" data-act="pickAssessment" data-type="' + esc(f.def.type) + '">โหลดแบบประเมินใหม่</button>';
        if (err.data && err.data.missing) err.data.missing.forEach(c => { const el = $('[data-q="' + CSS.escape(c) + '"].q'); if (el) el.classList.add('missing'); });
      } finally { f.submitting = false; }
    });
  },
  async review(form){
    const d = formData(form);
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try { const r = await api('reviewScreening', d); closeAllModals(); toast(r.message, 'ok'); render(); }
      catch (err) { toast(err.message, 'bad'); }
    });
  },
  async void(form){
    const d = formData(form);
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try { const r = await api('voidScreening', d); closeAllModals(); toast(r.message, 'ok'); render(); }
      catch (err) { toast(err.message, 'bad'); }
    });
  },
  async user(form){
    const d = formData(form); const msg = $('#um-msg'); msg.innerHTML = '';
    const villages = $$('input[name=village]:checked', form).map(i => i.value);
    const scope = form.scope_all.checked && !form.scope_all.disabled ? '*' : villages;
    if (scope !== '*' && !villages.length) { msg.innerHTML = errorBox({ message: 'กรุณาเลือกหมู่บ้านที่รับผิดชอบอย่างน้อย 1 หมู่บ้าน' }); return; }
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try {
        if (d.user_id) {
          const r = await api('updateUser', { user_id: d.user_id, display_name: d.display_name, role: d.role, village_scope: scope, active_status: !!d.active_status });
          closeAllModals(); toast(r.message, 'ok'); render();
        } else {
          const r = await api('createUser', { username: d.username.toLowerCase(), display_name: d.display_name, role: d.role, village_scope: scope }, { timeout: 45000 });
          closeAllModals(); render(); showTempPassword(r.data.user.username, r.data.temp_password);
        }
      } catch (err) { msg.innerHTML = errorBox(err); }
    });
  },
  async approve(form){
    const d = formData(form);
    if (!await confirmDialog('อนุมัติเกณฑ์แบบประเมิน', '<p>เมื่ออนุมัติแล้ว ' + esc(TYPE_LABEL[d.assessment_type]) + ' เวอร์ชัน ' + esc(d.version) + ' จะถูกใช้คำนวณผลจริง และเวอร์ชันที่อนุมัติก่อนหน้าจะถูกปลดออก (RETIRED)</p>', 'อนุมัติ')) return;
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try { const r = await api('approveAssessment', { assessment_type: d.assessment_type, version: d.version, approved_by_name: d.approved_by_name, confirm_verified: !!d.confirm_verified }); toast(r.message, 'ok'); State.catalog = null; render(); }
      catch (err) { toast(err.message, 'bad'); }
    });
  },
  async village(form){
    const d = formData(form);
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try { const r = await api('createVillage', { moo_number: Number(d.moo_number), village_name: d.village_name }); toast(r.message, 'ok'); State.villages = (await api('listVillages')).data; render(); }
      catch (err) { toast(err.message, 'bad'); }
    });
  },
  async renameVillage(form){
    const d = formData(form);
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try { await api('updateVillage', d); closeAllModals(); toast('บันทึกแล้ว', 'ok'); State.villages = (await api('listVillages')).data; render(); }
      catch (err) { toast(err.message, 'bad'); }
    });
  },
  async appConfig(form){
    const d = formData(form);
    await submitWith(form.querySelector('[type=submit]'), async () => {
      try { const r = await api('updateAppConfig', d); toast(r.message, 'ok'); }
      catch (err) { toast(err.message, 'bad'); }
    });
  }
};

function showDuplicateDialog(err, form){
  const d = err.data || { in_scope: [], out_of_scope_count: 0 };
  const m = openModal(modalHead('พบรายการที่อาจเป็นบุคคลเดียวกัน') +
    '<p class="small muted" style="margin-top:-6px">ระบบไม่ตัดสินจากชื่ออย่างเดียว กรุณาตรวจสอบวันเกิด หมู่บ้าน และข้อมูลอื่นกับผู้รับบริการ</p>' +
    (d.in_scope.length ? '<div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>วันเกิด</th><th>หมู่บ้าน</th><th>ลักษณะที่ตรงกัน</th><th></th></tr></thead><tbody>' +
      d.in_scope.map(r => '<tr><td><span class="code">' + esc(r.patient_id) + '</span></td><td>' + esc(r.full_name) + '</td><td>' + fmtDate(r.birth_date) + '</td><td>' + esc(r.village_label) + '</td><td>' + (r.match_type === 'STRONG' ? '<span class="pill bad">ชื่อและวันเกิดตรงกัน</span>' : '<span class="pill warn">ชื่อตรงกันในหมู่บ้านเดียวกัน</span>') + '</td><td><button class="btn sm" data-act="openPatient" data-id="' + esc(r.patient_id) + '">เปิดดู</button></td></tr>').join('') + '</tbody></table></div>' : '') +
    (d.out_of_scope_count ? '<div class="alert warn mt-s">' + icon('alert') + '<div>พบรายการชื่อและวันเกิดตรงกันนอกพื้นที่สิทธิ์ของท่าน ' + d.out_of_scope_count + ' รายการ กรุณาประสานเจ้าหน้าที่ก่อนลงทะเบียนใหม่</div></div>' : '') +
    '<div class="modal-foot"><button class="btn" data-act="closeModal">กลับไปแก้ไข</button><button class="btn primary" data-dup="confirm">ยืนยันว่าเป็นคนละคน และบันทึก</button></div>', { size: 'lg' });
  m.querySelector('[data-dup=confirm]').addEventListener('click', () => { m.remove(); Forms.patient(form, true); });
  m.addEventListener('click', e => { if (e.target.closest('[data-act=openPatient]')) m.remove(); });
}

const Changes = {
  answer(el){ if (!State.form) return; State.form.answers[el.dataset.q] = el.value; updateScreeningUI(); },
  completion(el){ $('#inc-wrap').style.display = el.value === 'INCOMPLETE' && el.checked ? '' : 'none'; },
  roleSelect(){ syncScopeUI(); },
  scopeAll(){ syncScopeUI(); },
  auditFilter(el){ State.params.auditAction = el.value; render(); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = Actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = Forms[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change]');
  if (t && Changes[t.dataset.change]) Changes[t.dataset.change](t, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const last = $('#modal-root').lastElementChild;
  if (last && last.dataset.dismissable === '1') last.remove();
  else document.body.classList.remove('nav-open');
});

/* ---------- Boot ---------- */
(async function init(){
  render();
  if (MODE === 'none') { setConn('none'); return; }
  setConn('wait');
  try {
    const p = await api('ping', {}, { timeout: 20000 });
    if (!p.data.db_configured) {
      $('#view').insertAdjacentHTML('afterbegin', '<div class="alert warn" style="margin-bottom:16px">' + icon('alert') + '<div>Backend เชื่อมต่อได้ แต่ยังไม่ได้ตั้งค่าฐานข้อมูล — ผู้ดูแลระบบต้องรัน <span class="code">SetupSheet()</span> ก่อน</div></div>');
    }
  } catch (err) {
    $('#view').insertAdjacentHTML('afterbegin', '<div class="alert bad" style="margin-bottom:16px">' + icon('alert') + '<div><b>ไม่สามารถเชื่อมต่อ Backend ได้</b> — ' + esc(err.message) + '<br><span class="small">ระบบจะไม่แสดงข้อมูลใด ๆ จนกว่าการเชื่อมต่อจะสำเร็จ</span></div></div>');
    return;
  }
  if (IS_FILE && MODE === 'fetch') {
    $('#view').insertAdjacentHTML('afterbegin', '<div class="alert info" style="margin-bottom:16px">' + icon('file') + '<div class="small">กำลังเปิดไฟล์จากเครื่องคอมพิวเตอร์และเชื่อมต่อผ่าน Web App URL — สำหรับการใช้งานจริงแนะนำให้เปิดผ่าน URL ของ Apps Script Web App โดยตรง</div></div>');
  }
  const saved = readToken();
  if (saved) {
    State.token = saved;
    try {
      const r = await api('getSession');
      applySession(r.data);
      await afterLogin();
    } catch (e) { State.token = null; storeToken(null); State.session = null; render(); }
  }
})();
</script>
</body>
